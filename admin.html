<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RESELL HUB - 관리자 시스템</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #fcfaf7;
      --card-bg: #ffffff;
      --accent-color: #8c7355;
      --expert-gold: #d4a373;
      --danger-color: #e63946;
      --text-main: #332c27;
      --text-muted: #7f756b;
      --border-color: #eee8e0;
      --shadow-color: rgba(140, 115, 85, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; overflow-x: hidden; }

    header {
      display: flex; flex-direction: column; gap: 0.8rem;
      padding: 1rem 1.2rem; background-color: rgba(252, 250, 247, 0.95);
      border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 1.2rem; font-weight: 800; color: var(--accent-color); letter-spacing: -0.5px; }

    .container { max-width: 1000px; margin: 1rem auto; padding: 0 1rem; }
    .page-title { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.6rem; align-items: flex-start; }
    .page-title h2 { font-size: 1.2rem; }
    
    .btn { padding: 0.45rem 0.8rem; border-radius: 6px; border: none; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-home { background: var(--border-color); color: var(--text-main); }
    .btn-write { background: var(--accent-color); color: white; }
    .btn-edit { background: var(--accent-color); color: white; border: none; padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; margin-right: 0.2rem; }
    .btn-delete { background: var(--danger-color); color: white; border: none; padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }

    .table-responsive { width: 100%; overflow-x: auto; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 12px var(--shadow-color); background: var(--card-bg); }
    .admin-table { width: 100%; border-collapse: collapse; min-width: 550px; }
    .admin-table th, .admin-table td { padding: 0.7rem 0.8rem; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }
    .admin-table th { background: #f7f3ed; color: var(--text-muted); font-weight: 700; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(51, 44, 39, 0.4); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 200; padding: 1rem;
    }
    .modal-content {
      background-color: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 1.5rem; width: 100%; max-width: 500px; position: relative; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--text-muted); font-size: 1.3rem; cursor: pointer; }
    .modal-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 1.2rem; text-align: center; color: var(--accent-color); }
    .form-group { margin-bottom: 0.8rem; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.3rem; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 0.65rem; background: var(--bg-color); border: 1px solid var(--border-color);
      border-radius: 8px; color: var(--text-main); font-size: 0.85rem; outline: none;
    }
    .btn-submit {
      width: 100%; padding: 0.7rem; background: var(--accent-color); color: white;
      border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 0.4rem;
    }
    .hidden { display: none !important; }

    @media (min-width: 769px) {
      header { flex-direction: row; justify-content: space-between; padding: 1rem 2rem; }
      .page-title { flex-direction: row; justify-content: space-between; align-items: center; }
      .admin-table { min-width: auto; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚙️ RESELL HUB 어드민 센터</div>
    <div>
      <a href="index.html" class="btn btn-home">🏠 메인으로 돌아가기</a>
    </div>
  </header>

  <main class="container">
    <div id="access-denied" class="hidden" style="text-align: center; margin-top: 3rem;">
      <h2 style="color: var(--danger-color); margin-bottom: 1rem; font-size: 1.2rem;">⚠️ 접근 권한이 없습니다.</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">관리자 계정으로 로그인 후 이용해주세요.</p>
      <a href="index.html" class="btn btn-write">메인으로 이동하여 로그인하기</a>
    </div>

    <div id="admin-content" class="hidden">
      <div class="page-title">
        <h2>전체 게시글 통합 관리 센터</h2>
        <button class="btn btn-write" onclick="openNoticeModal()">📢 관리자 공지글 작성</button>
      </div>

      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th style="width: 10%;">ID</th>
              <th style="width: 15%;">구분</th>
              <th>제목</th>
              <th style="width: 25%;">작성일시</th>
              <th style="width: 20%;">관리</th>
            </tr>
          </thead>
          <tbody id="admin-post-list"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="notice-modal-overlay" class="modal-overlay hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('notice-modal-overlay')">✕</button>
      <h3 class="modal-title">📌 공지사항 게시글 등록</h3>
      
      <div class="form-group">
        <label>게시판 위치</label>
        <select id="notice-target">
          <option value="free">자유게시판</option>
          <option value="appraisal">명품 감정 탭</option>
        </select>
      </div>
      <div class="form-group"><label>공지 제목</label><input type="text" id="notice-title" placeholder="공지사항 제목"></div>
      <div class="form-group"><label>공지 내용</label><textarea id="notice-content" rows="5" placeholder="공지사항 내용"></textarea></div>
      <button class="btn-submit" onclick="handleWriteNotice()">상단 고정 공지 등록하기</button>
    </div>
  </div>

  <div id="edit-modal-overlay" class="modal-overlay hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('edit-modal-overlay')">✕</button>
      <h3 class="modal-title">✏️ 게시글 수정</h3>
      
      <input type="hidden" id="edit-post-id">
      <div class="form-group"><label>제목</label><input type="text" id="edit-title"></div>
      <div class="form-group"><label>내용</label><textarea id="edit-content" rows="6"></textarea></div>
      <button class="btn-submit" onclick="handleUpdatePost()">수정사항 저장하기</button>
    </div>
  </div>

  <script>
    const ADMIN_EMAIL = "admin@email.com"; 

    const SUPABASE_URL = 'https://wnekidpaiqkdxcovxckz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0ntmu7elx6JF7gnKVRac6Q_gngQijPi';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allPostsData = [];

    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (session && session.user.email === ADMIN_EMAIL) {
        document.getElementById('admin-content').classList.remove('hidden');
        fetchPosts();
      } else {
        document.getElementById('access-denied').classList.remove('hidden');
      }
    });

    function openNoticeModal() { document.getElementById('notice-modal-overlay').classList.remove('hidden'); }
    function closeModal(modalId) { document.getElementById(modalId).classList.add('hidden'); }

    async function fetchPosts() {
      const { data: posts, error } = await supabaseClient.from('posts').select('*').order('created_at', { ascending: false });
      if (error || !posts) return;

      allPostsData = posts;
      const adminContainer = document.getElementById('admin-post-list');

      adminContainer.innerHTML = posts.map(p => `
        <tr>
          <td>${p.id}</td>
          <td>${p.title.startsWith('[공지]') ? '<b style="color:var(--expert-gold)">공지</b>' : '일반'}</td>
          <td>${escapeHtml(p.title)}</td>
          <td>${new Date(p.created_at).toLocaleDateString()}</td>
          <td>
            <button class="btn-edit" onclick="openEditModal(${p.id})">수정</button>
            <button class="btn-delete" onclick="deletePost(${p.id})">삭제</button>
          </td>
        </tr>
      `).join('');
    }

    // ★ Supabase 삭제 로직 수정 완료
    async function deletePost(postId) {
      if (!confirm('정말 이 게시글을 삭제하시겠습니까?')) return;
      
      try {
        const { error } = await supabaseClient.from('posts').delete().eq('id', postId);
        
        if (error) {
          alert('삭제 실패: ' + error.message);
        } else { 
          alert('게시글이 DB에서 정상 삭제되었습니다.'); 
          fetchPosts(); // 목록 재갱신
        }
      } catch (err) {
        alert('삭제 처리 도중 에러가 발생했습니다.');
        console.error(err);
      }
    }

    function openEditModal(postId) {
      const post = allPostsData.find(p => p.id === postId);
      if (!post) return;

      document.getElementById('edit-post-id').value = post.id;
      document.getElementById('edit-title').value = post.title;
      document.getElementById('edit-content').value = post.content;

      document.getElementById('edit-modal-overlay').classList.remove('hidden');
    }

    async function handleUpdatePost() {
      const postId = document.getElementById('edit-post-id').value;
      const newTitle = document.getElementById('edit-title').value;
      const newContent = document.getElementById('edit-content').value;

      if (!newTitle || !newContent) return alert('제목과 내용을 모두 입력해주세요.');

      const { error } = await supabaseClient
        .from('posts')
        .update({ title: newTitle, content: newContent })
        .eq('id', postId);

      if (error) alert('수정 실패: ' + error.message);
      else {
        alert('성공적으로 수정되었습니다.');
        closeModal('edit-modal-overlay');
        fetchPosts();
      }
    }

    async function handleWriteNotice() {
      const target = document.getElementById('notice-target').value;
      const title = document.getElementById('notice-title').value;
      const content = document.getElementById('notice-content').value;

      if (!title || !content) return alert('제목과 내용을 입력해주세요.');

      const prefix = target === 'appraisal' ? '[공지] [감정요청] ' : '[공지] ';

      const { error } = await supabaseClient
        .from('posts')
        .insert([{ title: prefix + title, content: content }]);

      if (error) alert('공지 등록 실패: ' + error.message);
      else {
        alert('공지사항이 성공적으로 게시되었습니다.');
        document.getElementById('notice-title').value = '';
        document.getElementById('notice-content').value = '';
        closeModal('notice-modal-overlay');
        fetchPosts();
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
