<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 페이지 - 게시글 관리</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f4f4f4; }
    .btn-delete {
      background-color: #ff4d4f;
      color: white;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 4px;
    }
    .btn-delete:hover { background-color: #d9363e; }
  </style>
</head>
<body>

  <h2>게시글 관리</h2>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>제목</th>
        <th>작성일</th>
        <th>관리</th>
      </tr>
    </thead>
    <tbody id="post-list">
      <!-- 예시 데이터: 실제 서비스에서는 서버 데이터를 반복문으로 출력합니다 -->
      <tr id="post-row-1">
        <td>1</td>
        <td>첫 번째 게시글입니다.</td>
        <td>2026-08-19</td>
        <td>
          <button class="btn-delete" onclick="deletePost(1)">삭제</button>
        </td>
      </tr>
      <tr id="post-row-2">
        <td>2</td>
        <td>두 번째 게시글입니다.</td>
        <td>2026-08-19</td>
        <td>
          <button class="btn-delete" onclick="deletePost(2)">삭제</button>
        </td>
      </tr>
    </tbody>
  </table>

  <script>
    async function deletePost(postId) {
      if (!confirm(`${postId}번 게시글을 정말 삭제하시겠습니까?`)) {
        return;
      }

      try {
        // 1. 서버에 삭제 요청 (사용 중인 백엔드 API 경로로 수정하세요)
        const response = await fetch(`/api/posts/${postId}`, {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json'
            // 필요 시 CSRF 토큰이나 인증 헤더 추가
            // 'Authorization': 'Bearer ' + token
          }
        });

        // 2. 백엔드 처리 결과 판별 (HTTP 상태 코드 200~299)
        if (response.ok) {
          alert("성공적으로 삭제되었습니다.");
          
          // 방식 A: 화면 전체 새로고침
          location.reload();

          // 방식 B: 새로고침 없이 DOM에서 해당 행만 즉시 제거하고 싶다면 아래 주석을 해제하세요.
          // const targetRow = document.getElementById(`post-row-${postId}`);
          // if (targetRow) targetRow.remove();
        } else {
          // 백엔드에서 400, 403, 500 등 에러를 반환한 경우
          const errorData = await response.json().catch(() => ({}));
          const errorMessage = errorData.message || `삭제 실패 (상태 코드: ${response.status})`;
          alert(`삭제 처리 실패: ${errorMessage}`);
        }

      } catch (error) {
        // 네트워크 연결 오류 또는 서버 다운 시
        console.error("삭제 요청 중 에러 발생:", error);
        alert("서버와 통신하는 도중 오류가 발생했습니다. 네트워크 상태나 콘솔(F12)을 확인하세요.");
      }
    }
  </script>
</body>
</html>
