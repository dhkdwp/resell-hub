<script>
  const ADMIN_EMAIL = "angjeseo@kakao.com"; 

  const SUPABASE_URL = 'https://wnekidpaiqkdxcovxckz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_0ntmu7elx6JF7gnKVRac6Q_gngQijPi';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let allPostsData = [];

  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    
    if (session && session.user.email === ADMIN_EMAIL) {
      document.getElementById('admin-content').classList.remove('hidden');
      await fetchPosts();
    } else {
      document.getElementById('access-denied').classList.remove('hidden');
    }
  });

  function openNoticeModal() { document.getElementById('notice-modal-overlay').classList.remove('hidden'); }
  function closeModal(modalId) { document.getElementById(modalId).classList.add('hidden'); }

  async function fetchPosts() {
    const { data: posts, error } = await supabaseClient
      .from('posts')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error('목록 불러오기 실패:', error);
      return;
    }

    allPostsData = posts || [];
    renderAdminTable(allPostsData);
  }

  // 테이블 그리는 로직 분리
  function renderAdminTable(posts) {
    const adminContainer = document.getElementById('admin-post-list');
    if (!adminContainer) return;

    adminContainer.innerHTML = posts.map(p => `
      <tr>
        <td>${p.id}</td>
        <td>${p.title.startsWith('[공지]') ? '<b style="color:var(--expert-gold)">공지</b>' : '일반'}</td>
        <td>${escapeHtml(p.title)}</td>
        <td>${new Date(p.created_at).toLocaleDateString()}</td>
        <td>
          <button class="btn-edit" onclick="openEditModal(${p.id})">수정</button>
          <button class="btn-delete" onclick="deletePost(${p.id})">삭제</button>
        </td>
      </tr>
    `).join('');
  }

  // ★ 삭제 처리 개선 (DB 삭제 즉시 화면 배열에서도 제거하여 갱신)
  async function deletePost(postId) {
    if (!confirm('정말 이 게시글을 삭제하시겠습니까?')) return;
    
    try {
      const { error } = await supabaseClient
        .from('posts')
        .delete()
        .eq('id', postId);
      
      if (error) {
        alert('삭제 실패: ' + error.message);
      } else { 
        alert('게시글이 삭제되었습니다.'); 
        
        // 1. 메모리상의 데이터에서 삭제된 항목 즉시 제거
        allPostsData = allPostsData.filter(p => p.id !== postId);
        
        // 2. 화면 즉시 다시 그리기
        renderAdminTable(allPostsData);

        // 3. DB 서버 데이터와 다시 동기화
        await fetchPosts();
      }
    } catch (err) {
      alert('삭제 처리 도중 에러가 발생했습니다.');
      console.error(err);
    }
  }

  function openEditModal(postId) {
    const post = allPostsData.find(p => p.id === postId);
    if (!post) return;

    document.getElementById('edit-post-id').value = post.id;
    document.getElementById('edit-title').value = post.title;
    document.getElementById('edit-content').value = post.content;

    document.getElementById('edit-modal-overlay').classList.remove('hidden');
  }

  async function handleUpdatePost() {
    const postId = document.getElementById('edit-post-id').value;
    const newTitle = document.getElementById('edit-title').value;
    const newContent = document.getElementById('edit-content').value;

    if (!newTitle || !newContent) return alert('제목과 내용을 모두 입력해주세요.');

    const { error } = await supabaseClient
      .from('posts')
      .update({ title: newTitle, content: newContent })
      .eq('id', postId);

    if (error) {
      alert('수정 실패: ' + error.message);
    } else {
      alert('성공적으로 수정되었습니다.');
      closeModal('edit-modal-overlay');
      await fetchPosts();
    }
  }

  async function handleWriteNotice() {
    const target = document.getElementById('notice-target').value;
    const title = document.getElementById('notice-title').value;
    const content = document.getElementById('notice-content').value;

    if (!title || !content) return alert('제목과 내용을 입력해주세요.');

    const prefix = target === 'appraisal' ? '[공지] [감정요청] ' : '[공지] ';

    const { error } = await supabaseClient
      .from('posts')
      .insert([{ title: prefix + title, content: content }]);

    if (error) {
      alert('공지 등록 실패: ' + error.message);
    } else {
      alert('공지사항이 성공적으로 게시되었습니다.');
      document.getElementById('notice-title').value = '';
      document.getElementById('notice-content').value = '';
      closeModal('notice-modal-overlay');
      await fetchPosts();
    }
  }

  function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
